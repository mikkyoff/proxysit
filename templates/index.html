<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EURUSD_otc — Live Chart + Indicators</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #0d1017; color: #d1d4dc; }
        #header {
            padding: 10px 18px; background: #161b22;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #2a2e39; flex-wrap: wrap; gap: 8px;
        }
        #header .title { font-size: 14px; font-weight: 600; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .ok { background: #26a69a; color: white; }
        .err { background: #ef5350; color: white; }
        .warn { background: #f0a500; color: white; }
        #chartWrap { display: flex; flex-direction: column; height: calc(100vh - 48px); }
        #chart { flex: 1 1 auto; min-height: 0; width: 100%; }
        #indicatorBar {
            flex: 0 0 auto; display: flex; gap: 1px;
            background: #2a2e39; border-top: 1px solid #2a2e39;
        }
        .card {
            flex: 1 1 0; min-width: 160px; background: #1e222d;
            padding: 8px 14px; display: flex; flex-direction: column; gap: 2px;
        }
        .card .label { font-size: 10px; letter-spacing: 1px; color: #787b86; text-transform: uppercase; }
        .card .value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .card .sub { font-size: 11px; color: #787b86; }
        .pos { color: #26a69a; } .neg { color: #ef5350; } .neutral { color: #d1d4dc; }
        .signal-badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 13px; font-weight: 700; }
        .bar-track { height: 6px; background: #2a2e39; border-radius: 3px; overflow: hidden; margin-top: 4px; }
        .bar-fill { height: 100%; border-radius: 3px; transition: width 0.15s linear; }
    </style>
</head>
<body>
    <div id="header">
        <div class="title" id="title">EURUSD_otc — 1m Live Chart + Indicators</div>
        <div id="status"><span class="badge warn">Connecting...</span></div>
    </div>
    <div id="chartWrap">
        <div id="chart"></div>
        <div id="indicatorBar">
            <div class="card">
                <span class="label">RSI (14)</span>
                <span class="value" id="rsiVal">—</span>
                <span class="sub" id="rsiSub">warming up</span>
            </div>
            <div class="card">
                <span class="label">EMA (6)</span>
                <span class="value" id="emaVal">—</span>
                <span class="sub">Price is <span class="signal-badge" id="emaSignal">—</span> EMA</span>
            </div>
            <div class="card">
                <span class="label">% to Upper BB</span>
                <span class="value" id="bbUpVal">—</span>
                <div class="bar-track"><div class="bar-fill" id="bbUpBar" style="width:0%;background:#26a69a;"></div></div>
                <span class="sub" id="bbUpSub">Need ≥ 40% for BUY</span>
            </div>
            <div class="card">
                <span class="label">% to Lower BB</span>
                <span class="value" id="bbLoVal">—</span>
                <div class="bar-track"><div class="bar-fill" id="bbLoBar" style="width:0%;background:#ef5350;"></div></div>
                <span class="sub" id="bbLoSub">Need ≥ 40% for SELL</span>
            </div>
            <div class="card">
                <span class="label">BB Bandwidth</span>
                <span class="value" id="bbBwVal">—</span>
                <span class="sub" id="bbRange">U: — / L: —</span>
            </div>
        </div>
    </div>

    <script>
    const chartContainer = document.getElementById('chart');
    const statusEl = document.getElementById('status');
    const titleEl = document.getElementById('title');

    const chart = LightweightCharts.createChart(chartContainer, {
        layout: { background: { color: '#0d1017' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
        timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2a2e39' },
        rightPriceScale: { borderColor: '#2a2e39' },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    });
    const candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
        wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    });
    const bbUpperSeries = chart.addLineSeries({ color: '#2962ff', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    const bbMiddleSeries = chart.addLineSeries({ color: '#f0a500', lineWidth: 1, lineStyle: 2, priceLineVisible: false, lastValueVisible: false });
    const bbLowerSeries = chart.addLineSeries({ color: '#2962ff', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    const emaSeries = chart.addLineSeries({ color: '#e91e63', lineWidth: 2, priceLineVisible: false });

    let initializedChart = false;
    const fmt = (n, d=5) => (n===null||n===undefined||isNaN(n)) ? '—' : Number(n).toFixed(d);
    const fmtPct = (n) => (n===null||n===undefined||isNaN(n)) ? '—' : Number(n).toFixed(2)+'%';

    function buildLines(candles, cfg) {
        const closes = [];
        const bbU = [], bbM = [], bbL = [], emaD = [];
        let e = null;
        const k = 2/(cfg.ema_period+1);
        for (let i=0;i<candles.length;i++){
            const c = candles[i];
            closes.push(c.close);
            if (closes.length >= cfg.bb_period){
                const win = closes.slice(-cfg.bb_period);
                const mean = win.reduce((a,b)=>a+b,0)/cfg.bb_period;
                const v = win.reduce((a,b)=>a+(b-mean)**2,0)/cfg.bb_period;
                const sd = Math.sqrt(v);
                bbU.push({time:c.time,value:mean+cfg.bb_std*sd});
                bbM.push({time:c.time,value:mean});
                bbL.push({time:c.time,value:mean-cfg.bb_std*sd});
            }
            if (closes.length === cfg.ema_period){
                e = closes.slice(0,cfg.ema_period).reduce((a,b)=>a+b,0)/cfg.ema_period;
                emaD.push({time:c.time,value:e});
            } else if (closes.length > cfg.ema_period && e !== null){
                e = c.close*k + e*(1-k);
                emaD.push({time:c.time,value:e});
            }
        }
        return {bbU, bbM, bbL, emaD};
    }

    async function tick() {
        try {
            const res = await fetch('/api/candles');
            const data = await res.json();
            const slot = data.data.slots[0];
            if (!slot) return;
            const snap = Object.values(slot.assets)[0];
            if (!snap) return;

            const candles = snap.candles.map(x => ({time:x.time,open:x.open,high:x.high,low:x.low,close:x.close}));
            const ind = snap.indicators || {};
            const cfg = {bb_period: ind.bb_period||20, bb_std: ind.bb_std||2, ema_period: ind.ema_period||6};
            const lines = buildLines(candles, cfg);

            candleSeries.setData(candles);
            bbUpperSeries.setData(lines.bbU);
            bbMiddleSeries.setData(lines.bbM);
            bbLowerSeries.setData(lines.bbL);
            emaSeries.setData(lines.emaD);

            if (snap.forming) {
                candleSeries.update({
                    time: snap.forming.time,
                    open: snap.forming.open, high: snap.forming.high,
                    low: snap.forming.low, close: snap.forming.close,
                });
            }

            if (!initializedChart && candles.length > 0) {
                chart.timeScale().fitContent();
                initializedChart = true;
            }

            document.getElementById('rsiVal').textContent = fmt(ind.rsi, 2);
            document.getElementById('rsiVal').className = 'value ' + (ind.rsi == null ? 'neutral' :
                ind.rsi >= 70 ? 'neg' : ind.rsi <= 30 ? 'pos' : 'neutral');
            document.getElementById('rsiSub').textContent =
                ind.rsi == null ? 'warming up' :
                ind.rsi >= 70 ? 'Overbought' :
                ind.rsi <= 30 ? 'Oversold' : 'Neutral';

            document.getElementById('emaVal').textContent = fmt(ind.ema, 5);
            const sig = document.getElementById('emaSignal');
            sig.textContent = ind.ema_signal || '—';
            sig.className = 'signal-badge ' + (ind.ema_signal === 'ABOVE' ? 'pos' : ind.ema_signal === 'BELOW' ? 'neg' : 'neutral');

            const up = ind.bb_pct_to_upper;
            document.getElementById('bbUpVal').textContent = fmtPct(up);
            document.getElementById('bbUpVal').className = 'value ' + (up >= 40 ? 'pos' : 'neg');
            document.getElementById('bbUpBar').style.width = (up == null ? 0 : Math.max(0,Math.min(100,up))) + '%';
            document.getElementById('bbUpBar').style.background = up >= 40 ? '#26a69a' : '#f0a500';
            document.getElementById('bbUpSub').innerHTML = up >= 40 ? '✅ Headspace OK for BUY' : '⚠ Need ≥ 40% for BUY';

            const lo = ind.bb_pct_to_lower;
            document.getElementById('bbLoVal').textContent = fmtPct(lo);
            document.getElementById('bbLoVal').className = 'value ' + (lo >= 40 ? 'pos' : 'neg');
            document.getElementById('bbLoBar').style.width = (lo == null ? 0 : Math.max(0,Math.min(100,lo))) + '%';
            document.getElementById('bbLoBar').style.background = lo >= 40 ? '#ef5350' : '#f0a500';
            document.getElementById('bbLoSub').innerHTML = lo >= 40 ? '✅ Headspace OK for SELL' : '⚠ Need ≥ 40% for SELL';

            document.getElementById('bbBwVal').textContent = fmtPct(ind.bb_bandwidth);
            document.getElementById('bbRange').textContent = `U: ${fmt(ind.bb_upper)} / L: ${fmt(ind.bb_lower)}`;

            const stat = slot.stats;
            if (!stat.connected) {
                statusEl.innerHTML = `<span class="badge warn">DISCONNECTED</span>`;
            } else if (!snap.aligned_started) {
                statusEl.innerHTML = `<span class="badge warn">SEEDED ${snap.seeded_count} — WAITING FOR BOUNDARY</span>`;
            } else {
                statusEl.innerHTML = `<span class="badge ok">LIVE</span> ` +
                    `${snap.closed_count} candles · ${stat.slot_tick_rate_60s.toFixed(2)} ticks/s` +
                    (stat.proxy ? ` · proxy ${stat.proxy}` : ' · direct');
            }
        } catch (e) {
            statusEl.innerHTML = `<span class="badge err">CLIENT: ${e.message}</span>`;
        }
    }

    tick();
    setInterval(tick, 1000);
    window.addEventListener('resize', () => {
        chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
    });
    </script>
</body>
</html>
